# Robô de cotações da página pública (grátis em repositório público).
# Atualiza cotacoes.js com uma lista ampla da B3 (universo.txt) — não a
# carteira de ninguém. Seg–sex 18h30 de Brasília (21:30 UTC) e botão manual.
name: Cotações

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yfinance
        run: pip install --quiet --disable-pip-version-check yfinance
      - name: Buscar cotações
        run: python scripts/cotacoes_publicas.py
      - name: Salvar (só se mudou)
        run: |
          if [ -z "$(git status --porcelain -- cotacoes.js)" ]; then
            echo "Nenhuma mudança nas cotações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotacoes.js
          git commit -m "Cotações $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git push
